# .goreleaser.yaml: release pipeline for tapelibrary_exporter.
#
# Host-agnostic: this file is always scaffolded, regardless of --forge.
# `goreleaser build` and `goreleaser release --clean --snapshot` run entirely
# locally and need no forge at all - only a container engine (for the Docker
# images) and, for the signing/SBOM steps, cosign and syft on PATH. A repo
# scaffolded with --forge none stays fully versioned and releasable this way;
# see docs/release-process.md for the manual-release flow when there is no
# CI to drive it. `goreleaser check` validates this file's schema without
# building anything.
#
# GoReleaser config schema verified against the current GoReleaser major
# (v2, latest stable 2.16.0) via its own docs before writing this file -
# see this task's report for what changed as a result (notably: dockers_v2's
# `extra_files` requirement, and `sboms.args` needing an explicit override to
# actually produce CycloneDX instead of the tool's own SPDX default).

version: 2

project_name: tapelibrary_exporter

release:
  github:
    owner: sckyzo
  name_template: "{{ .ProjectName }} v{{ .Version }}"
  # Auto-detects a pre-release tag (anything containing "-", e.g. v1.2.0-rc1)
  # and marks it as a pre-release on GitHub; a stable tag (v1.2.0) publishes
  # normally. See docs/release-process.md's "Release candidate tag" section
  # for the RC workflow this enables.
  prerelease: auto

builds:
  - id: tapelibrary_exporter
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
    binary: "{{ .ProjectName }}"
    main: "./cmd/tapelibrary_exporter"
    # BUILD_USER must not contain whitespace. GoReleaser joins these entries
    # into one -ldflags string, and a value with a space becomes two linker
    # arguments - the build then dies printing the linker's usage. Quoting the
    # value here does NOT help (verified); the fix belongs at the call site,
    # which is why every caller passes a single token: CI passes github.actor,
    # and `make release-snapshot` passes git's user.email, matching what
    # docker-build already does.
    ldflags:
      - "-s -w"
      - "-X=github.com/prometheus/common/version.Version={{.Version}}"
      - "-X=github.com/prometheus/common/version.Revision={{.Commit}}"
      - "-X=github.com/prometheus/common/version.Branch={{.Branch}}"
      - "-X=github.com/prometheus/common/version.BuildUser={{.Env.BUILD_USER}}"
      - "-X=github.com/prometheus/common/version.BuildDate={{.Env.BUILD_DATE}}"
    env:
      - CGO_ENABLED=0

archives:
  - id: tapelibrary_exporter-release-archive
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    # config.example.yml is not decoration: this exporter refuses to start
    # without --config.file, and the bundled README tells the reader to copy
    # that file. Shipping the README without it hands out an instruction
    # pointing at something the archive does not contain.
    # CHANGELOG.md rides along for the same reason it is written the way it is
    # - it addresses whoever deploys this, who is exactly the person holding
    # this archive.
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - config.example.yml

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

# Supply-chain artefacts. Four things make up this project's SBOM/signing
# story (see README.md's "Security & supply chain" section for the
# operator-facing verification recipes):
#
#   1. SBOM (CycloneDX) per archive, produced automatically on every
#      release - what's inside each tarball/zip.
#   2. SBOM (CycloneDX) for the container image, generated on demand via
#      `make sbom-image` (syft) - GoReleaser cannot produce this itself
#      (sboms: below only ever accepts archive artifacts, a documented
#      upstream limitation, not a missing config knob); see
#      docs/release-process.md. The image ALSO carries a supplementary,
#      registry-embedded SPDX attestation from dockers_v2's own
#      `sbom: "true"` (below), produced automatically on every release -
#      a different format, not a substitute for the CycloneDX artefact
#      `make sbom-image` produces.
#   3. Cosign signature on the checksum file, produced automatically on
#      every release - proves the release artefacts weren't tampered with
#      after build.
#   4. Cosign signatures on the multi-arch Docker manifests, produced
#      automatically on every release - see docker_signs below.
#
# All signatures are keyless via Sigstore: the signing identity is the CI
# workflow itself, attested by its own OIDC token - never a long-lived
# private key checked in anywhere. Consumers verify with `cosign verify` /
# `cosign verify-blob`, no public key distribution required.
sboms:
  - artifacts: archive
    # syft's own GoReleaser default emits SPDX; this project standardizes on
    # CycloneDX, so the output format is pinned explicitly rather than left
    # on the tool's default (verified via GoReleaser's current sbom docs -
    # the reference this was derived from has this same override missing,
    # so it silently produces SPDX despite documenting CycloneDX).
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - "--yes"
      - "${artifact}@${digest}"

# Docker images: standard + minimal, both multi-arch (linux/amd64+arm64),
# published to GHCR only by default. GHCR needs no secret beyond the
# `GITHUB_TOKEN` every Actions run already has (see the release workflow's
# `packages: write` permission, if the GitHub layer is in use) - add a
# second registry (e.g. Docker Hub) by appending an image below plus a
# matching `docker login`/secrets pair in the release workflow. Not wired by
# default so a fresh scaffold's release pipeline never fails on a registry
# credential the operator hasn't configured yet.
#
# dockers_v2 collapses what would otherwise be 4 `dockers` + 2
# `docker_manifests` entries (per-arch builds x manifest combination x
# variant) into 2, building true multi-arch manifests via `docker buildx`
# directly. It is still marked experimental upstream as of GoReleaser 2.16 -
# re-validate via a snapshot/RC build after bumping the pinned version below.
#
# Deliberate deviation from GoReleaser's own recommended dockers_v2 usage:
# its docs explicitly recommend COPYing a binary GoReleaser already
# cross-compiled - dockers_v2's build context is an ephemeral directory that
# contains no source files by design, specifically to avoid rebuilding.
# Dockerfile/Dockerfile.minimal here are deliberately self-contained
# multi-stage builds instead (see either file's own header comment): a bare
# `docker build .` works immediately after scaffolding, with no GoReleaser/CI
# precondition at all. `extra_files` below stages exactly the source tree
# those Dockerfiles COPY, so the exact same Dockerfile that works locally
# also works here - at the cost of a slower, QEMU-emulated non-native-arch
# build during release instead of an instant COPY. Acceptable for an
# infrequent release pipeline; the local `make docker-build`/`docker build .`
# path (this task's hot path) pays none of that cost.
dockers_v2:
  - id: standard
    dockerfile: Dockerfile
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
    images:
      - 'ghcr.io/{{ tolower "sckyzo" }}/{{ tolower .ProjectName }}'
    tags:
      - "{{ .Version }}"
      - '{{ if eq .Prerelease "" }}{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if eq .Prerelease "" }}{{ .Major }}{{ end }}'
      - '{{ if eq .Prerelease "" }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: "true"
    labels:
      "org.opencontainers.image.title": "tapelibrary_exporter"
      "org.opencontainers.image.description": "Prometheus exporter that collects metrics from https://<library-address>/web/api/v1"
      "org.opencontainers.image.licenses": "gpl-3.0"
      "org.opencontainers.image.source": "https://github.com/sckyzo/tapelibrary_exporter"
      "org.opencontainers.image.documentation": "https://github.com/sckyzo/tapelibrary_exporter"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
    build_args:
      VERSION: "{{ .Version }}"
      COMMIT: "{{ .FullCommit }}"
      BRANCH: "{{ .Branch }}"
      BUILD_USER: "goreleaser"
      BUILD_DATE: "{{ .Date }}"

  - id: minimal
    dockerfile: Dockerfile.minimal
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
    images:
      - 'ghcr.io/{{ tolower "sckyzo" }}/{{ tolower .ProjectName }}'
    tags:
      - "{{ .Version }}-minimal"
      - '{{ if eq .Prerelease "" }}{{ .Major }}.{{ .Minor }}-minimal{{ end }}'
      - '{{ if eq .Prerelease "" }}{{ .Major }}-minimal{{ end }}'
      - '{{ if eq .Prerelease "" }}latest-minimal{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: "true"
    labels:
      "org.opencontainers.image.title": "tapelibrary_exporter (minimal)"
      "org.opencontainers.image.description": "Prometheus exporter that collects metrics from https://<library-address>/web/api/v1 (minimal variant, distroless)"
      "org.opencontainers.image.licenses": "gpl-3.0"
      "org.opencontainers.image.source": "https://github.com/sckyzo/tapelibrary_exporter"
      "org.opencontainers.image.documentation": "https://github.com/sckyzo/tapelibrary_exporter"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
    build_args:
      VERSION: "{{ .Version }}"
      COMMIT: "{{ .FullCommit }}"
      BRANCH: "{{ .Branch }}"
      BUILD_USER: "goreleaser"
      BUILD_DATE: "{{ .Date }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^refactor:"
      - "^perf:"
      - "^build:"
  groups:
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "Other Changes"
      order: 999
