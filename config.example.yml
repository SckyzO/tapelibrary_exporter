# Example configuration file for tapelibrary_exporter.
#
# This file has no effect on its own. --config.file defaults to empty, so
# nothing here is read unless you start the exporter with:
#
#   ./tapelibrary_exporter --config.file=/path/to/your-config.yml
#
# Copy this file, edit the copy, and point --config.file at it; nothing
# scans for a config file automatically.
#
# --config.file is not --web.config.file. This file (config.file) configures
# what the exporter does: which flags get which values, and how it
# authenticates to whatever it queries. --web.config.file is a separate flag,
# from prometheus/exporter-toolkit, that configures the TLS/Basic Auth the
# exporter's own HTTP server presents to Prometheus. Mixing the two up means
# looking in the wrong file when either side misbehaves.
#
# The file has two sections, and one rule decides which a setting belongs to:
# anything a command-line flag can already express goes under "flags:",
# keyed by the flag's own long name, without the leading "--". Anything a
# flag cannot express, such as authentication or TLS for the requests an
# HTTP-flavor exporter makes outward, gets its own section instead
# (http_client_config: below). No setting is ever expressible in both
# places, so a value never has two conflicting sources.
#
# Precedence, highest wins: command-line flag, then this file, then the
# process environment, then the flag's own built-in default. In particular,
# a value set here is overridden by the same flag passed on the command
# line, and this file itself sits above the environment, not below it.
#
# Paths written inside this file, such as password_file below or
# tls_config's ca_file/cert_file/key_file, resolve relative to this file's
# own location, not to the exporter's working directory. Prefer a *_file
# form over an inline value for any secret (password_file over password,
# for example) so the secret itself never has to live in this file.

flags:
  # A plain scalar: one value for the flag.
  log.level: info

  # A bool must be written as a YAML boolean (true/false), not a quoted
  # string. Watch out for the reverse case, though: this parser reads YAML
  # 1.1, so an UNQUOTED yes, no, on, or off also resolves to a boolean. If a
  # flag takes a string value that happens to be one of those words, quote
  # it (log.level: "on") to keep it a string.
  web.disable-exporter-metrics: false

  # A repeatable flag becomes a YAML list, one entry per repetition on the
  # command line. web.listen-address defaults to a single address; listing
  # two here binds both instead of just the second one. Pick addresses that
  # do not overlap: on Linux, a wildcard address already covers both IPv4
  # and IPv6 on the same port, so also listing an explicit ::1 on that same
  # port fails to bind. The second entry below deliberately sits well outside
  # the 9100 to 9999 range exporters draw their default port from, so it
  # cannot collide with the first whatever port this exporter was built with.
  web.listen-address:
    - ":9170"
    - "127.0.0.1:19101"

  # A collector's own flags follow the same rule as any built-in flag, so
  # anything `--collector.<name>.<setting>` accepts on the command line can be
  # written here under its own flag name instead.

  # Bounds how many outbound requests this exporter has in flight at once,
  # per watched instance. 0 (the default) means unlimited. See
  # docs/configuration.md's "Bounding outbound concurrency" section.
  # Set to 1 here on purpose: the TS4500's LCC and robotics path serialize
  # internally, so a second concurrent request buys nothing and risks
  # degrading the very machine this exporter observes. The cost is that a
  # slow collector delays its siblings on the same library, which is visible
  # in tapelibrary_exporter_request_wait_seconds rather than hidden.
  exporter.max-requests-per-target: 1

# http_client_config carries the authentication and TLS settings no flag can
# express, and applies to this exporter's outbound requests to the libraries.
# It is unrelated to --web.config.file, which configures the TLS server this
# exporter itself exposes.
#
# Commented out here on purpose: an active block pointing at password_file/
# ca_file/cert_file/key_file paths that do not exist on your machine would
# fail --config.file loading outright, which is the last thing an example
# meant to be copied and tried should do. Uncomment it and point the paths
# at your own files to use it.
#
# basic_auth CARRIES the credentials, but NO Authorization header is ever
# sent. That is worth the surprise it causes, and it is not a bug.
#
# The TS4500 accepts no HTTP authentication scheme at all (verified against a
# real library 2026-08-03: a GET carrying an Authorization header is answered
# 401, with no WWW-Authenticate challenge). What it wants instead is those
# same two strings POSTed to /v1/login, which returns a JSESSIONID cookie that
# every subsequent request carries. This exporter performs that handshake for
# you: it reads username/password (or password_file) out of the block below,
# strips the block before building the transport so nothing goes on the wire
# for no purpose, logs in on the first request, renews the session whenever
# the library expires it, and logs out at shutdown.
#
# Practical consequences:
#   - Omit basic_auth entirely and the exporter sends no credentials and
#     performs no login, which every request will then be refused.
#   - password_file is preferred over an inline password, and must contain
#     ONLY the password: a trailing newline is trimmed, anything else is not.
#   - Logging out at shutdown is not cosmetic. The library's session table is
#     finite, so an exporter killed with SIGKILL repeatedly will eventually be
#     refused a new session until the old ones expire on their own.
#
# A TS4500 running its FACTORY certificate needs insecure_skip_verify, and
# that is forced by the hardware rather than chosen for convenience. Verified
# against a real library 2026-08-03: the certificate is self-signed
# (subject == issuer, CN=ibm.com, O=International Business Machines Corp.M)
# and carries NO subjectAltName at all — no DNS name, no IP. Go has ignored
# the Common Name since 1.15 and removed the fallback entirely in 1.17, so
# every way of writing a verifying config fails:
#
#   server_name: <the library's own hostname>
#     -> x509: certificate is not valid for any names
#   server_name: ibm.com
#     -> x509: certificate relies on legacy Common Name field, use SANs instead
#   no server_name (falls back to the address)
#     -> x509: certificate is not valid for any names
#
# ca_file does NOT help. Pinning that certificate as the trust root fixes
# chain validation, which was never the problem; it is NAME validation that
# fails, and no CA can supply a SAN the certificate does not contain.
#
# The risk this accepts, stated rather than hidden: with
# insecure_skip_verify the connection is encrypted but unauthenticated, so
# anything able to intercept the path to the library can present its own
# certificate and read the monitoring account's credentials. Keep the traffic
# on a network you trust end to end, and prefer basic_auth's password_file
# over an inline password so the secret is not in this file.
#
# The clean fix is on the library, not here: replace the factory certificate
# with one carrying a proper subjectAltName (TS4500 GUI, Settings -> Security
# -> Certificates), then switch to the verifying block commented below it.
#
# http_client_config:
#   basic_auth:
#     username: monitoring
#     password_file: /etc/tapelibrary_exporter/basic_auth_password
#   tls_config:
#     insecure_skip_verify: true
#
# Once the library presents a certificate with a subjectAltName, this is the
# block to switch to instead:
#
# http_client_config:
#   basic_auth:
#     username: monitoring
#     password_file: /etc/tapelibrary_exporter/basic_auth_password
#   tls_config:
#     ca_file: /etc/tapelibrary_exporter/ca.crt
#     server_name: library1.example.internal
#     insecure_skip_verify: false

# instances: the libraries this exporter watches. THIS SECTION IS REQUIRED.
# One process serves all of them through one /metrics, and it refuses to start
# without at least one entry, so this is the section to edit after copying this
# file to config.yml.
#
#   name     becomes the `library` label on every series this instance emits,
#            so it must be unique and stable: renaming one breaks the
#            continuity of its history in Prometheus.
#   address  the RoE API root, including the /web/api/v1 path.
#   labels   copied verbatim onto every series from this instance. Keep them
#            low-cardinality and describe the machine, not its current state.
#
# Prometheus scrapes THIS EXPORTER once, not the five libraries: `instance` is
# the exporter's own host and `library` names the machine. Group and alert by
# `library`. See monitoring/prometheus/scrape-config.example.yml.
instances:
  - name: library1
    address: https://library1.example.internal/web/api/v1
    labels:
      model: ts4500

  # - name: library2
  #   address: https://library2.example.internal/web/api/v1
  #   labels:
  #     model: ts4500

# modules: named credential/TLS bundles, selected by name rather than applied
# globally. Each instances: entry above may carry a module: key naming one of
# them, resolved once at boot. A module's collectors: key is REFUSED on this
# build: collector enablement is global, via --[no-]collector.<name>, so a
# per-module subset would be meaningless. See docs/configuration.md.
#
# Declaring modules leaves the top-level http_client_config: above unread,
# since every instance resolves its credentials through its own module.
#
# Commented out for the same reason as http_client_config: above, an active
# block pointing at files that do not exist on your machine would fail to load.
#
# This earns its keep when the fleet does not share one monitoring account:
#
# modules:
#   default:
#     http_client_config:
#       basic_auth:
#         username: monitoring
#         password_file: /etc/tapelibrary_exporter/password
#       tls_config:
#         insecure_skip_verify: true
#   legacy:
#     http_client_config:
#       basic_auth:
#         username: monitoring
#         password_file: /etc/tapelibrary_exporter/legacy_password
#       tls_config:
#         insecure_skip_verify: true
#
# instances:
#   - name: library1
#     address: https://library1.example.internal/web/api/v1
#     module: legacy
