# tapelibrary_exporter: example compose file for the standard image (Dockerfile).
#
# Hardened by default:
#   - no-new-privileges: the container can never gain more privileges than
#     it started with (e.g. via a setuid/setgid binary).
#   - every Linux capability dropped - this exporter needs none of them.
#   - the root filesystem is read-only - a stateless HTTP exporter has no
#     legitimate reason to write anywhere.
#   - /tmp is a small in-memory tmpfs, for the rare case something still
#     wants a writable path (e.g. a library that insists on a temp file).
#
# Before the first run, create the instance list this exporter cannot start
# without - the multi-instance target model requires --config.file:
#
#   cp config.example.yml config.yml    # then edit the addresses in it
#
# config.yml is gitignored on purpose, so a real fleet's addresses and
# credentials never reach a commit.
#
# Environment overrides:
#
#   IMAGE       image to run                   default: tapelibrary_exporter:dev
#   HOST_PORT   host-side port for /metrics    default: 9170

services:
  tapelibrary_exporter:
    image: ${IMAGE:-tapelibrary_exporter:dev}
    container_name: tapelibrary_exporter
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9170}:9170"
    volumes:
      - ./config.yml:/etc/tapelibrary_exporter/config.yml:ro
      # basic_auth is commented out in config.example.yml, so nothing else is
      # needed to start. Enable it with password_file and mount that too:
      #   - ./password:/etc/tapelibrary_exporter/password:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command:
      - --config.file=/etc/tapelibrary_exporter/config.yml
      - --web.listen-address=:9170
      - --log.level=info
